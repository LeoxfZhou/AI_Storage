[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agent-orchestration-template"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["openai-agents>=0.7", "pydantic>=2.7", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_orchestration"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
