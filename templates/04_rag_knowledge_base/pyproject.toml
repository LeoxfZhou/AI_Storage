[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "rag-knowledge-base-template"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["openai>=2.0", "pydantic>=2.7", "PyYAML>=6.0", "Jinja2>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/rag_app"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
