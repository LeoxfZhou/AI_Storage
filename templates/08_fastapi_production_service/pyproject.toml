[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "fastapi-llm-production-template"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "openai>=2.0",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8.0"]

[dependency-groups]
dev = ["httpx>=0.27", "pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/production_service"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
